[package]
name = "thestuu-desktop"
version = "0.1.0"
description = "TheStuu desktop shell (Tauri) — window and OS integration only"
authors = ["TheStuu"]
edition = "2021"

[lib]
name = "thestuu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
